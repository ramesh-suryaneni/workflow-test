name: CI Pipeline

on:
  push:
    branches:
      - main
      - devlopment
      - release/*
      - hotfix/*
  # Optional: Also trigger on pull requests to these branches
  pull_request:
    branches:
      - main
      - devlopment
      - release/*
      - hotfix/*
  workflow_dispatch:  # Enables manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
